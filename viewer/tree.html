<script>
"use strict";

const TYPE_ZH = {
  conceptual: "概念理解",
  procedural: "程序性技能",
  reasoning: "推理证明",
  application: "应用实践",
  modeling: "建模探究"
};

const GRADE_ZH = { 7: "七", 8: "八", 9: "九" };

const DATASETS = {
  "cn-math": {
    name: "中国初中数学",
    fullName: "中国初中数学知识图谱（七—九年级）",
    note: "· 2D 拓扑大纲与先修链诊断测评工作台（333 节点 · 629 依赖）",
    topicsCandidates: [
      "../sources/cn-math-taxonomy/data/topics.json",
      "/sources/cn-math-taxonomy/data/topics.json",
      "sources/cn-math-taxonomy/data/topics.json"
    ],
    depsCandidates: [
      "../sources/cn-math-taxonomy/data/dependencies.json",
      "/sources/cn-math-taxonomy/data/dependencies.json",
      "sources/cn-math-taxonomy/data/dependencies.json"
    ],
    defaultId: "cnm_001"
  },
  "marble": {
    name: "Marble 国际微知识点",
    fullName: "Marble 国际微知识点图谱（K-6 全学科）",
    note: "· 官方微知识点与先修拓扑诊断大纲（1590 节点 · 3221 依赖）",
    topicsCandidates: [
      "../data/topics.json",
      "/data/topics.json",
      "data/topics.json"
    ],
    depsCandidates: [
      "../data/dependencies.json",
      "/data/dependencies.json",
      "data/dependencies.json"
    ],
    defaultId: "mt_AzTrT5ySCx"
  },
  "union": {
    name: "全量联合图谱",
    fullName: "联合微知识点拓扑图谱（初中数学 + Marble 国际）",
    note: "· 跨课程体系联合索引大纲（1923 节点 · 3837 依赖）",
    topicsCandidates: [
      "../data/union/topics.json",
      "/data/union/topics.json",
      "data/union/topics.json"
    ],
    depsCandidates: [
      "../data/union/dependencies.json",
      "/data/union/dependencies.json",
      "data/union/dependencies.json"
    ],
    defaultId: "marble:mt_AzTrT5ySCx"
  }
};

const $ = s => document.querySelector(s);
const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) {
    if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  }
  return e;
};

let currentDatasetKey = "cn-math";
let i18n = null;
let topics = [], deps = [], byId = new Map(), pre = new Map(), post = new Map(), selected = null;
let viewMode = "tree";

// 加载国际化对照字典
async function loadI18n() {
  try {
    const res = await fetch("i18n-data.json");
    if (res.ok) i18n = await res.json();
  } catch (e) {
    console.warn("未加载到 i18n-data.json，将使用内置基础对照。");
  }
}

// 统一数据归一化
function normalizeTopics(rawTopics, dsKey) {
  const rawList = Array.isArray(rawTopics) ? rawTopics : (rawTopics.topics || []);
  return rawList.map(t => {
    const id = t.id;
    const isCnMath = id.startsWith("cnm_") || (t.sourceId && t.sourceId.includes("cn-math"));
    const isMarble = id.startsWith("mt_") || (t.sourceId && t.sourceId.includes("marble"));

    const name = t.name || id;
    const subject = t.subject || (isCnMath ? "数学" : "综合");
    const domain = t.domain || "";
    const typeRaw = (t.type || "conceptual").toLowerCase();
    const type = TYPE_ZH[typeRaw] ? typeRaw : "conceptual";

    // 中文本地化翻译对照
    let zhTitle = "";
    if (i18n && i18n.nodes && i18n.nodes[name]) {
      zhTitle = i18n.nodes[name].zhTitle || "";
    }
    const zhDomain = (i18n && i18n.domainMap && i18n.domainMap[domain]) || domain;
    const zhSubject = (i18n && i18n.subjectMap && i18n.subjectMap[subject]) || subject;

    // 掌握标准 (Evidence of Mastery)
    let criteria = [];
    if (Array.isArray(t.mastery_criteria) && t.mastery_criteria.length) {
      criteria = t.mastery_criteria;
    } else if (Array.isArray(t.evidence) && t.evidence.length) {
      criteria = t.evidence;
    }

    // 核心诊断题与测评评估提示 (Diagnostic Question / Assessment Prompt)
    let diag = null;
    if (t.diagnostic_question && (t.diagnostic_question.question || t.diagnostic_question.answer)) {
      diag = {
        question: t.diagnostic_question.question || "",
        answer: t.diagnostic_question.answer || ""
      };
    } else if (t.assessmentPrompt) {
      const cleanPrompt = t.assessmentPrompt.replace(/\{\{name\}\}/g, "孩子/学习者");
      diag = {
        question: cleanPrompt,
        answer: criteria.length ? "诊断与评估指标：\n• " + criteria.join("\n• ") : "依据当前微知识点的核心掌握标准进行情境诊断验证。"
      };
    }

    // 权威课程标准映射 (Standards)
    const standards = Array.isArray(t.standards) ? t.standards : [];

    // 年级 / 适龄阶段显示
    let ageLabel = "";
    let group = "";
    if (t.external) {
      group = "小学先修（外部基础）";
      ageLabel = "小学";
    } else if (t.grade != null && t.semester) {
      const g = GRADE_ZH[t.grade] || t.grade;
      group = `${g}年级${t.semester}册`;
      ageLabel = `${g}年级${t.semester}`;
    } else if (t.grade != null) {
      const g = GRADE_ZH[t.grade] || t.grade;
      group = `${g}年级`;
      ageLabel = `${g}年级`;
    } else if (t.ageRangeStart != null && t.ageRangeEnd != null) {
      group = `${zhSubject} · 适龄 ${t.ageRangeStart}-${t.ageRangeEnd} 岁`;
      ageLabel = `适龄 ${t.ageRangeStart}-${t.ageRangeEnd} 岁`;
    } else {
      group = zhSubject || "通用知识模块";
      ageLabel = zhSubject || "通用";
    }

    return {
      ...t,
      id,
      name,
      zhTitle,
      subject,
      zhSubject,
      domain,
      zhDomain,
      chapter: t.chapter || "",
      type,
      description: t.description || "",
      mastery_criteria: criteria,
      diagnostic_question: diag,
      standards,
      group,
      ageLabel,
      external: Boolean(t.external),
      isCnMath,
      isMarble
    };
  });
}

function normalizeDeps(rawDeps) {
  const rawList = Array.isArray(rawDeps) ? rawDeps : (rawDeps.dependencies || []);
  return rawList.map(d => ({
    topicId: d.topicId,
    prerequisiteId: d.prerequisiteId,
    strength: d.strength || "hard",
    reason: d.reason || (d.strength === "hard" ? "核心先决条件" : "辅助支撑基础")
  }));
}

// 切换并加载指定数据集
async function switchDataset(dsKey, targetNodeId) {
  const ds = DATASETS[dsKey] || DATASETS["cn-math"];
  currentDatasetKey = dsKey;

  // 同步 URL 参数
  try {
    const url = new URL(window.location);
    url.searchParams.set("dataset", dsKey);
    window.history.replaceState(null, "", url);
  } catch (e) {}

  // 同步 Header 下拉框
  const sel = $("#datasetSelector");
  if (sel && sel.value !== dsKey) sel.value = dsKey;

  // 更新 Header 标题与说明
  $("#pageTitle").textContent = ds.fullName;
  $("#pageNote").textContent = ds.note;

  // 尝试加载数据文件
  let loaded = false;
  let rawTopics = null, rawDeps = null;

  for (let i = 0; i < ds.topicsCandidates.length; i++) {
    try {
      const [tRes, dRes] = await Promise.all([
        fetch(ds.topicsCandidates[i]),
        fetch(ds.depsCandidates[i])
      ]);
      if (tRes.ok && dRes.ok) {
        rawTopics = await tRes.json();
        rawDeps = await dRes.json();
        loaded = true;
        break;
      }
    } catch (e) {}
  }

  if (!loaded) {
    $("#main").replaceChildren(el("div", { id: "err" },
      el("b", { text: `无法加载数据集 [${ds.name}]。` }), el("br"),
      `未能成功请求到 [${ds.topicsCandidates[0]}]，请确认本地 HTTP 服务正常运行。`));
    $("#count").textContent = "";
    return;
  }

  topics = normalizeTopics(rawTopics, dsKey);
  deps = normalizeDeps(rawDeps);

  // 构筑图索引
  byId = new Map();
  pre = new Map();
  post = new Map();

  for (const t of topics) {
    byId.set(t.id, t);
    pre.set(t.id, []);
    post.set(t.id, []);
  }

  for (const d of deps) {
    if (pre.has(d.topicId)) pre.get(d.topicId).push({ id: d.prerequisiteId, strength: d.strength, reason: d.reason });
    if (post.has(d.prerequisiteId)) post.get(d.prerequisiteId).push({ id: d.topicId, strength: d.strength, reason: d.reason });
  }

  for (const m of [pre, post]) {
    for (const arr of m.values()) {
      arr.sort((x, y) => (x.strength === y.strength ? 0 : x.strength === "hard" ? -1 : 1) || x.id.localeCompare(y.id));
    }
  }

  // 动态重建过滤器选项
  rebuildFilters(dsKey);

  // 渲染列表
  renderList();

  // 确定选中的节点
  let selId = targetNodeId || location.hash.slice(1);
  if (!byId.has(selId)) {
    selId = ds.defaultId;
    if (!byId.has(selId) && topics.length > 0) {
      const first = topics.find(t => !t.external) || topics[0];
      selId = first.id;
    }
  }

  if (byId.has(selId)) {
    select(selId, true);
  }
}

// 动态构建过滤器下拉框
function rebuildFilters(dsKey) {
  // 1. 学科 / 领域下拉框 (fDomain)
  const selDom = $("#fDomain");
  selDom.replaceChildren(el("option", { value: "", text: "全部学科 / 细分领域" }));

  if (dsKey === "cn-math") {
    const domains = [...new Set(topics.map(t => t.domain))].filter(Boolean);
    for (const d of domains) selDom.append(el("option", { value: d, text: d }));
  } else {
    // Marble 或 Union：按学科聚合
    const subjMap = new Map();
    for (const t of topics) {
      const s = t.zhSubject || t.subject;
      if (!subjMap.has(s)) subjMap.set(s, new Set());
      if (t.domain) subjMap.get(s).add(t.zhDomain || t.domain);
    }

    for (const [s, domSet] of subjMap) {
      const grp = el("optgroup", { label: s });
      // 支持按一级学科直接筛选
      grp.append(el("option", { value: "SUBJ:" + s, text: `【${s}】全部微知识点` }));
      for (const d of domSet) {
        grp.append(el("option", { value: d, text: d }));
      }
      selDom.append(grp);
    }
  }

  // 2. 年级 / 适龄阶段 (fGrade)
  const selGrade = $("#fGrade");
  selGrade.replaceChildren(el("option", { value: "", text: dsKey === "cn-math" ? "全部年级" : "全部学段 / 适龄" }));

  if (dsKey === "cn-math") {
    const opts = [
      { v: "7上", t: "七年级上" }, { v: "7下", t: "七年级下" },
      { v: "8上", t: "八年级上" }, { v: "8下", t: "八年级下" },
      { v: "9上", t: "九年级上" }, { v: "9下", t: "九年级下" },
      { v: "7", t: "七年级（全）" }, { v: "8", t: "八年级（全）" }, { v: "9", t: "九年级（全）" }
    ];
    for (const o of opts) selGrade.append(el("option", { value: o.v, text: o.t }));
  } else {
    // Marble 适龄段
    const ageRanges = [
      { v: "5-7", t: "适龄 5-7 岁 (K-1 启蒙)" },
      { v: "7-9", t: "适龄 7-9 岁 (Grades 2-3 中小)" },
      { v: "9-11", t: "适龄 9-11 岁 (Grades 4-5 高阶)" },
      { v: "11-14", t: "适龄 11-14 岁 (初中衔接)" }
    ];
    for (const a of ageRanges) selGrade.append(el("option", { value: a.v, text: a.t }));
  }

  // 3. 认知类型 (fType)
  const selType = $("#fType");
  selType.replaceChildren(el("option", { value: "", text: "全部认知类型" }));
  for (const [k, v] of Object.entries(TYPE_ZH)) {
    selType.append(el("option", { value: k, text: v }));
  }

  // 4. 外部先修开关
  const hasExt = topics.some(t => t.external);
  const lblExt = $("#lblExt");
  if (lblExt) {
    lblExt.style.display = hasExt ? "flex" : "none";
    if (dsKey === "cn-math") lblExt.innerHTML = '<input type="checkbox" id="fExt"> 含小学先修';
    else lblExt.innerHTML = '<input type="checkbox" id="fExt"> 含外部依赖';
  }
}

function filtered() {
  const q = $("#q").value.trim().toLowerCase();
  const d = $("#fDomain").value;
  const g = $("#fGrade").value;
  const ty = $("#fType").value;
  const extInput = $("#fExt");
  const ext = extInput ? extInput.checked : true;

  return topics.filter(t => {
    if (t.external && !ext) return false;

    // 领域 / 学科匹配
    if (d) {
      if (d.startsWith("SUBJ:")) {
        const targetSubj = d.slice(5);
        if (t.zhSubject !== targetSubj && t.subject !== targetSubj) return false;
      } else {
        if (t.domain !== d && t.zhDomain !== d) return false;
      }
    }

    // 认知类型
    if (ty && t.type !== ty) return false;

    // 年级 / 适龄段
    if (g) {
      if (currentDatasetKey === "cn-math") {
        if (t.external) return false;
        if (g.length === 1 ? String(t.grade) !== g : (t.grade + t.semester) !== g) return false;
      } else {
        if (g === "5-7" && !(t.ageRangeStart >= 5 && t.ageRangeEnd <= 7)) return false;
        if (g === "7-9" && !(t.ageRangeStart >= 7 && t.ageRangeEnd <= 9)) return false;
        if (g === "9-11" && !(t.ageRangeStart >= 9 && t.ageRangeEnd <= 11)) return false;
        if (g === "11-14" && !(t.ageRangeStart >= 11 || t.ageRangeEnd >= 12)) return false;
      }
    }

    // 文本模糊搜索 (名称、中文标题、描述、ID、章节、领域)
    if (q) {
      const haystack = (t.name + " " + (t.zhTitle || "") + " " + t.description + " " + (t.chapter || "") + " " + (t.zhDomain || "") + " " + (t.zhSubject || "") + " " + t.id).toLowerCase();
      if (!haystack.includes(q)) return false;
    }

    return true;
  });
}

function renderList() {
  const items = filtered(), ul = $("#list");
  ul.replaceChildren();
  let lastGroup = null;

  for (const t of items) {
    const key = t.group;
    if (key !== lastGroup) {
      lastGroup = key;
      ul.append(el("li", { class: "grp", text: key }));
    }

    const titleEl = el("span", { class: "nm", text: t.name });
    const kids = [titleEl];

    // 若有中文翻译且不同于英文，显示小字中文对照
    if (t.zhTitle && t.zhTitle !== t.name) {
      kids.push(el("span", { class: "nm-sub", text: t.zhTitle }));
    }

    const metaText = t.external
      ? (t.zhDomain || t.domain)
      : (t.chapter ? (t.zhDomain || t.domain) + " · " + t.chapter.replace(/^.. /, "") : (t.zhDomain || t.domain) + " · " + t.ageLabel);

    kids.push(el("span", { class: "meta", text: metaText }));

    const li = el("li", {
      class: "item" + (t.id === selected ? " sel" : ""),
      "data-id": t.id,
      onclick: () => select(t.id, true)
    }, ...kids);

    ul.append(li);
  }

  $("#count").textContent = `显示 ${items.length} / ${topics.length} 个知识点`;
}

function select(id, push) {
  if (!byId.has(id)) return;
  selected = id;

  if (push && location.hash.slice(1) !== id) {
    history.replaceState(null, "", "#" + id);
  }

  // 同步 3D 星云跳转链接
  const btn3D = $("#btnGoTo3D");
  if (btn3D) {
    btn3D.href = `index.html?dataset=${currentDatasetKey}#${id}`;
  }

  for (const li of document.querySelectorAll("#list li.item")) {
    li.classList.toggle("sel", li.dataset.id === id);
  }
  const cur = document.querySelector("#list li.sel");
  if (cur) cur.scrollIntoView({ block: "nearest" });

  renderDetail(byId.get(id));
  $("#main").scrollTop = 0;
}

const link = id => {
  const n = byId.get(id);
  const title = n ? (n.zhTitle && n.zhTitle !== n.name ? `${n.name} (${n.zhTitle})` : n.name) : id;
  return el("a", { class: "node", onclick: () => select(id, true), text: title });
};

const badge = s => el("span", { class: "badge " + s, text: s === "hard" ? "硬先修" : "软先修" });

function renderDetail(t) {
  const m = $("#main");

  // 1. 顶部基础卡片 (Title + Tags + Description)
  const tagsList = [
    el("span", { class: "tag" + (t.external ? " ext" : ""), text: t.id }),
    el("span", { class: "tag subj", text: t.zhSubject || t.subject }),
    el("span", { class: "tag", text: t.zhDomain || t.domain }),
    el("span", { class: "tag", text: TYPE_ZH[t.type] || t.type }),
    el("span", { class: "tag", text: t.ageLabel })
  ];

  if (t.chapter) {
    tagsList.push(el("span", { class: "tag", text: t.chapter }));
  }

  // 课标映射徽章
  if (t.standards && t.standards.length) {
    for (const std of t.standards) {
      const code = typeof std === "string" ? std : (std.id || std.code || JSON.stringify(std));
      const title = typeof std === "object" && std.confidence
        ? `对齐课程标准: ${code} (匹配度: ${std.confidence})`
        : `对齐课程标准: ${code}`;
      tagsList.push(el("span", { class: "tag std", title: title, text: code }));
    }
  }

  const headKids = [
    el("h1", { class: "title", text: t.name })
  ];

  if (t.zhTitle && t.zhTitle !== t.name) {
    headKids.push(el("div", { class: "sub-title", text: "中文对应：" + t.zhTitle }));
  }

  headKids.push(el("div", { class: "tags" }, ...tagsList), el("p", { text: t.description }));

  const parts = [el("div", { class: "card" }, ...headKids)];

  // 2. 掌握标准 (Evidence of Mastery)
  if (t.mastery_criteria && t.mastery_criteria.length) {
    parts.push(el("div", { class: "card" },
      el("h2", { text: "微知识点掌握标准 (Evidence of Mastery)" }),
      el("ul", { class: "plain" }, t.mastery_criteria.map(c => el("li", { text: c })))));
  }

  // 3. 核心诊断题与测评提示 (Assessment Prompt / Diagnostic Question)
  if (t.diagnostic_question && t.diagnostic_question.question) {
    const qKids = [
      el("div", { class: "q-label", text: "核心诊断题 · 学习者测评" }),
      el("div", { text: t.diagnostic_question.question })
    ];

    if (t.diagnostic_question.answer) {
      qKids.push(
        el("details", { class: "ans" },
          el("summary", { text: "查看答案与评估诊断要点" }),
          el("div", { style: "white-space: pre-wrap;", text: t.diagnostic_question.answer })));
    }

    parts.push(el("div", { class: "card" }, el("h2", { text: "测评诊断" }), el("div", { class: "q" }, ...qKids)));
  }

  // 4. 先修链卡片与后续解锁卡片
  parts.push(prereqCard(t), postCard(t));
  m.replaceChildren(...parts);
}

function prereqCard(t) {
  const card = el("div", { class: "card" }), body = el("div");
  const direct = pre.get(t.id) || [];
  const all = ancestors(t.id);

  card.append(el("h2", { text: "先修链（向上递归 DAG）" }));
  if (!direct.length) {
    card.append(el("div", { class: "muted", text: t.external ? "外部基础节点，没有进一步先修。" : "基础起点概念，无需先修知识。" }));
    return card;
  }

  const bar = el("div", { class: "toolbar" },
    el("button", { class: viewMode === "tree" ? "on" : "", text: "树状结构", onclick: () => { viewMode = "tree"; renderDetail(t); } }),
    el("button", { class: viewMode === "layer" ? "on" : "", text: "最长路径分层", onclick: () => { viewMode = "layer"; renderDetail(t); } }),
    el("span", { class: "muted", text: `直接先修 ${direct.length} 个，累计上游 ${all.size} 个微知识点。树状图中同一知识点只在首次出现处展开。` }));

  card.append(bar, body);
  if (viewMode === "tree") body.append(tree(t.id));
  else body.append(layers(t.id));
  return card;
}

function ancestors(id) {
  const seen = new Set(), st = [id];
  while (st.length) {
    const cur = st.pop();
    for (const p of (pre.get(cur) || [])) {
      if (!seen.has(p.id)) { seen.add(p.id); st.push(p.id); }
    }
  }
  return seen;
}

function tree(rootId) {
  const expanded = new Set([rootId]);
  const build = id => {
    const ul = el("ul", { class: "tree" });
    for (const p of (pre.get(id) || [])) {
      const n = byId.get(p.id);
      if (!n) continue;
      const li = el("li");
      li.append(
        badge(p.strength),
        link(p.id),
        el("span", { class: "seen", text: " " + (n.external ? "小学" : n.ageLabel) }),
        el("span", { class: "why", text: "— " + p.reason }));

      if ((pre.get(p.id) || []).length) {
        if (expanded.has(p.id)) {
          li.append(el("span", { class: "seen", text: " （↑ 已在上方展开）" }));
        } else {
          expanded.add(p.id);
          li.append(build(p.id));
        }
      }
      ul.append(li);
    }
    return ul;
  };
  return build(rootId);
}

function layers(rootId) {
  const level = new Map();
  const walk = (id, d) => {
    for (const p of (pre.get(id) || [])) {
      if ((level.get(p.id) || 0) < d) {
        level.set(p.id, d);
        walk(p.id, d + 1);
      }
    }
  };
  walk(rootId, 1);
  const direct = new Map((pre.get(rootId) || []).map(p => [p.id, p.strength]));
  const max = level.size ? Math.max(...level.values()) : 0;
  const box = el("div");

  for (let d = 1; d <= max; d++) {
    const ids = [...level].filter(([, v]) => v === d).map(([k]) => k)
      .sort((a, b) => (byId.get(a).external - byId.get(b).external) || a.localeCompare(b));

    box.append(el("div", { class: "layer" },
      el("h3", { text: d === 1 ? "第 1 层：直接先修基石" : `第 ${d} 层：先修的先修（深度 ${d}）` }),
      el("div", { class: "chips" }, ids.map(id => {
        const n = byId.get(id);
        const nameDisp = n ? (n.zhTitle && n.zhTitle !== n.name ? `${n.name} (${n.zhTitle})` : n.name) : id;
        return el("span", { class: "chip" + (n && n.external ? " ext" : ""), onclick: () => select(id, true) },
          direct.has(id) ? badge(direct.get(id)) : null,
          nameDisp,
          el("span", { class: "seen", text: " " + (n ? (n.external ? "小学" : n.ageLabel) : "") }));
      }))));
  }
  box.append(el("div", { class: "muted", style: "margin-top: 8px;", text: "层数 = 到当前知识点的最长先修路径长度；越深越基础。" }));
  return box;
}

function postCard(t) {
  const card = el("div", { class: "card" }), list = post.get(t.id) || [];
  const down = new Set(), st = [t.id];
  while (st.length) {
    const cur = st.pop();
    for (const p of (post.get(cur) || [])) {
      if (!down.has(p.id)) { down.add(p.id); st.push(p.id); }
    }
  }

  card.append(el("h2", { text: `后续解锁概念（直接 ${list.length} 个，累计下游 ${down.size} 个）` }));
  if (!list.length) {
    card.append(el("div", { class: "muted", text: "没有后续微知识点直接依赖它（末端应用节点）。" }));
    return card;
  }

  card.append(el("ul", { class: "plain" }, list.map(p => {
    const n = byId.get(p.id);
    return el("li", {},
      badge(p.strength),
      link(p.id),
      el("span", { class: "seen", text: " " + (n ? (n.external ? "小学" : n.ageLabel) : "") }),
      el("span", { class: "why muted", text: " — " + p.reason }));
  })));

  return card;
}

// 主题切换控制器
const themeBtn = $("#themeToggleBtn");
function applyTheme(theme) {
  const isDark = theme === "dark";
  document.body.classList.toggle("theme-dark", isDark);
  if (themeBtn) {
    themeBtn.textContent = isDark ? "🌙 深色" : "☀️ 浅色";
    themeBtn.title = isDark ? "切换为浅色主题 (对齐参考)" : "切换为深色主题";
  }
  localStorage.setItem("hub_theme", theme);
}

const savedTheme = localStorage.getItem("hub_theme") || "light";
applyTheme(savedTheme);

if (themeBtn) {
  themeBtn.addEventListener("click", () => {
    const currentTheme = document.body.classList.contains("theme-dark") ? "dark" : "light";
    applyTheme(currentTheme === "dark" ? "light" : "dark");
  });
}

// 数据集切换监听
$("#datasetSelector").addEventListener("change", e => {
  switchDataset(e.target.value);
});

// 过滤器交互监听
for (const id of ["q", "fDomain", "fGrade", "fType"]) {
  $("#" + id).addEventListener("input", renderList);
}
// 委托复选框监听
$("#filters").addEventListener("change", e => {
  if (e.target && e.target.id === "fExt") renderList();
});

// URL Hash 监听
window.addEventListener("hashchange", () => {
  const hash = location.hash.slice(1);
  if (hash) {
    if (byId.has(hash)) {
      select(hash, false);
    } else {
      // 若当前图谱中未找到节点，检查是否来自其他数据集
      if (hash.startsWith("mt_") && currentDatasetKey !== "marble") {
        switchDataset("marble", hash);
      } else if (hash.startsWith("cnm_") && currentDatasetKey !== "cn-math") {
        switchDataset("cn-math", hash);
      } else if ((hash.startsWith("marble:") || hash.startsWith("cn-math:")) && currentDatasetKey !== "union") {
        switchDataset("union", hash);
      }
    }
  }
});

// 页面初始化入口
async function init() {
  await loadI18n();

  // 根据 URL query 参数与 hash 智能判断默认数据集
  const params = new URLSearchParams(window.location.search);
  const dsParam = params.get("dataset");
  const hash = location.hash.slice(1);

  let initialDataset = "cn-math";
  if (dsParam && DATASETS[dsParam]) {
    initialDataset = dsParam;
  } else if (hash) {
    if (hash.startsWith("mt_")) initialDataset = "marble";
    else if (hash.startsWith("marble:") || hash.startsWith("cn-math:")) initialDataset = "union";
    else if (hash.startsWith("cnm_")) initialDataset = "cn-math";
  }

  await switchDataset(initialDataset, hash);
}

init();
</script>
